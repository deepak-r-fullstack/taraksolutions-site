<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Tarak Solutions</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <script>
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("theme");
        } catch (e) {}
        var dark = t === "dark" || (t !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="section">
      <div class="container">
        <h1 class="not-found-title">This page does not exist.</h1>
        <p class="lead">The link may be old or mistyped. The homepage has everything: our work, services and how to reach us.</p>
        <p class="hero-actions"><a class="button button-primary" href="/">Go to the homepage</a></p>
      </div>
    </main>
  </body>
</html>
